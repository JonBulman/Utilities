[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jon-bulman-utilities"
version = "0.2.0"
description = "Common utility functions used across Jon Bulman projects"
readme = "README.md"
requires-python = ">=3.13"

authors = [
    {name = "Jon Bulman"}
]

dependencies = [
    "python-dotenv",
    "google-auth",
    "google-auth-oauthlib",
    "google-api-python-client"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]